  <body>
    <div id="app"><p id="boot">Loading Goblin Gamble&hellip;</p></div>
    <script>
      window.addEventListener(
        'error',
        (ev) => {
          const t = ev.target
          if (!t || t.tagName !== 'SCRIPT') return
          const boot = document.getElementById('boot')
          if (!boot) return
          boot.innerHTML =
            'GitHub Pages is serving the Vite source instead of the production build. ' +
            'In Settings → Pages, set folder to <code>/docs</code> (branch <code>main</code>), ' +
            'or set Source to GitHub Actions.'
        },
        true,
      )
    </script>
